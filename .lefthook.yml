pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    typos:
      glob: "**/*"
      run: typos --force-exclude

pre-push:
  parallel: false
  commands:
    lint:
      run: cargo lint
    test:
      run: cargo t

commit-msg:
  commands:
    conventional:
      # {1} is the commit-message file git hands to the hook.
      run: "grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\(.+\\))?!?: .+' {1}"
